name: ai_knowledge_companion
description: "AI Knowledge Companion - capture thoughts out loud, get organized knowledge."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4

  # Local data (architecture §5.3)
  drift: ^2.28.0
  drift_flutter: ^0.2.6
  sqlite3_flutter_libs: ^0.5.33

  # Security
  flutter_secure_storage: ^9.2.4

  # Audio (architecture §3.1)
  record: ^6.1.2
  just_audio: ^0.10.5
  path_provider: ^2.1.5

  # Cloud backend (architecture §6, §7.2)
  supabase_flutter: ^2.10.1
  google_sign_in: ^6.2.2

  # Engine client (architecture §7.1)
  dio: ^5.8.0+1

  # Contract validation (architecture §5.2)
  json_schema: ^5.2.0

  # Utilities
  uuid: ^4.5.2
  intl: ^0.20.2

  # Export (P5-E)
  pdf: ^3.11.1
  share_plus: ^7.2.2

  # Document capture (P6-F, universal input §4.12)
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
